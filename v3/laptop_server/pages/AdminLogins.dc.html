<!doctype html>
<!-- Smart Cabin - Faculty logins for the admin (user's design): everyone's username and ID card number in one table,
     one default password for all (valid a few days); each person sets their own at the first login. Logic in adminlogins.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Cabin – Faculty logins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html{font-size:clamp(14px, 0.42vw + 10.6px, 22px)}
body{margin:0}
a{color:#2a4a7a}a:hover{color:#14243f}
[hidden]{display:none !important}
</style>
</head>
<body>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 1rem; color: #1a211e; background: #f4f5f8; min-height: 100vh">

<header style="background: #1b2d4b; color: #ffffff">
<div style="max-width: 72.5rem; margin: 0 auto; padding: 0.875rem 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 0.625rem; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 1.125rem; margin-right: auto">Smart Cabin <span style="font-weight: 500; color: #cdd8ea">· Admin</span></a>
<span style="font-size: 0.875rem; color: #cdd8ea">Signed in as <span id="admin-name">–</span></span>
<a href="Login.dc.html" id="logout" style="display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0 0.875rem; border-radius: 0.5rem; border: 1px solid #5d7398; color: #ffffff; text-decoration: none; font-weight: 500">Log out</a>
</div>
</header>

<main style="max-width: 72.5rem; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; display: flex; flex-direction: column; gap: 1.25rem">
<a href="Devices.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2.75rem; margin-left: -0.5rem; padding: 0 0.5rem; border-radius: 0.5rem; color: #2a4a7a; text-decoration: none; font-size: 0.9375rem; font-weight: 600">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1rem; height: 1rem"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
Devices</a>
<h1 style="margin: 0; font-size: 2rem; font-weight: 700">Faculty logins</h1>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(11.25rem, 100%), 1fr)); gap: 0.75rem">
<div style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1rem 1.125rem"><div style="font-size: 0.8125rem; color: #4a5650">Faculty</div><div id="n-all" style="font-size: 1.625rem; font-weight: 700">–</div></div>
<div style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1rem 1.125rem"><div style="font-size: 0.8125rem; color: #4a5650">No login yet</div><div id="n-none" style="font-size: 1.625rem; font-weight: 700; color: #3c4842">–</div></div>
<div style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1rem 1.125rem"><div style="font-size: 0.8125rem; color: #4a5650">Must change password</div><div id="n-change" style="font-size: 1.625rem; font-weight: 700; color: #6b4a00">–</div></div>
<div style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1rem 1.125rem"><div style="font-size: 0.8125rem; color: #4a5650">Active</div><div id="n-active" style="font-size: 1.625rem; font-weight: 700; color: #14532d">–</div></div>
</div>

<section aria-labelledby="dp" style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 0.125rem 0.5rem rgba(27,45,75,0.08)">
<h2 id="dp" style="margin: 0; font-size: 0.75rem; font-weight: 600; color: #3c4842; text-transform: uppercase; letter-spacing: 0.06em">Default password</h2>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.75rem">
<label style="flex: 1 1 14rem; display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.8125rem; font-weight: 600; color: #3c4842">Default password
<input type="password" id="pw" autocomplete="new-password" style="min-height: 2.75rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; font: inherit; font-size: 0.9375rem; font-weight: 400"></label>
<label style="flex: 1 1 14rem; display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.8125rem; font-weight: 600; color: #3c4842">Default password again
<input type="password" id="pw2" autocomplete="new-password" style="min-height: 2.75rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; font: inherit; font-size: 0.9375rem; font-weight: 400"></label>
<label style="flex: 0 1 10rem; display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.8125rem; font-weight: 600; color: #3c4842">Valid for
<select id="days" style="min-height: 2.75rem; padding: 0 0.5rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; background: #ffffff; font: inherit; font-size: 0.9375rem; font-weight: 400"><option value="1">1 day</option><option value="3">3 days</option><option value="7" selected>7 days</option><option value="14">14 days</option></select></label>
<button type="button" id="create" style="min-height: 2.75rem; padding: 0 1.125rem; border: 0; border-radius: 0.5rem; background: #1b2d4b; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Create logins for all</button>
</div>
<p id="note" hidden role="status" style="margin: 0; font-size: 0.875rem; font-weight: 600"></p>
</section>

<section aria-labelledby="ls" style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.875rem; box-shadow: 0 0.125rem 0.5rem rgba(27,45,75,0.08)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem">
<h2 id="ls" style="margin: 0; font-size: 0.75rem; font-weight: 600; color: #3c4842; text-transform: uppercase; letter-spacing: 0.06em; margin-right: auto">Usernames and ID card numbers</h2>
<label style="flex: 1 1 16rem; max-width: 24rem; display: flex; align-items: center; gap: 0.5rem; min-height: 2.5rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; background: #ffffff">
<input type="search" id="q" aria-label="Search a name, server id or username" placeholder="Search a name, server id or username" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 0.875rem; background: transparent; color: #1a211e">
<svg viewBox="0 0 24 24" fill="none" stroke="#56625c" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 1rem; height: 1rem; flex: none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
</label>
</div>
<span id="count-text" style="font-size: 0.8125rem; color: #4a5650"></span>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 52rem; border-collapse: collapse; font-size: 0.875rem">
<thead><tr>
<th style="text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Server id</th>
<th style="text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Name</th>
<th style="text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">School</th>
<th style="text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Username</th>
<th style="text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">ID card number</th>
<th style="text-align: left; padding: 0.5rem 0.625rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Login</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>
</div>
<script src="api.js"></script>
<script src="adminlogins.js"></script>
</body>
</html>
