<!doctype html>
<!-- Smart Cabin - Devices page for the admin (user's design): the counts (also filters), the newest device, every faculty
     member (opens their admin page), recent events and the server log. Filled with live data by devices.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Cabin – Devices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html{font-size:clamp(14px, 0.42vw + 10.6px, 22px)}
body{margin:0}
a{color:#2a4a7a}a:hover{color:#14243f}
[hidden]{display:none !important}
</style>
</head>
<body>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 1rem; color: #1a211e; background: #f4f5f8; min-height: 100vh">

<header style="background: #1b2d4b; color: #ffffff">
<div style="max-width: 72.5rem; margin: 0 auto; padding: 0.875rem 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 0.625rem; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 1.125rem; margin-right: auto">
Smart Cabin <span style="font-weight: 500; color: #cdd8ea">· Admin</span></a>
<span style="font-size: 0.875rem; color: #cdd8ea">Signed in as <span id="admin-name">–</span></span>
<a href="AdminLogins.dc.html" style="color: #e2e9f5; text-decoration: none; font-weight: 500; padding: 0.625rem 0">Faculty logins</a>
<a href="Main.dc.html" style="color: #e2e9f5; text-decoration: none; font-weight: 500; padding: 0.625rem 0">Home</a>
<a href="Login.dc.html" id="logout" style="display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0 0.875rem; border-radius: 0.5rem; border: 1px solid #5d7398; color: #ffffff; text-decoration: none; font-weight: 500">Log out</a>
</div>
</header>

<main style="max-width: 72.5rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; display: flex; flex-direction: column; gap: 2rem">
<div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 0; font-size: 2rem; font-weight: 700">Edge devices</h1>
<div style="display: flex; align-items: center; gap: 0.75rem">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; color: #4a5650">Updated <span id="updated">–</span></span>
<button type="button" id="refresh" style="display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; padding: 0 1rem; border-radius: 0.5rem; border: 1px solid #b8c1cf; background: #ffffff; font: inherit; font-weight: 600; cursor: pointer; color: #1a211e">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1rem; height: 1rem"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
Refresh now</button>
</div>
</div>

<div id="tiles" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(11.25rem, 100%), 1fr)); gap: 0.75rem"></div>

<section aria-labelledby="nd" style="display: flex; flex-direction: column; gap: 0.75rem">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem">
<h2 id="nd" style="margin: 0; font-size: 1.25rem; font-weight: 700">Newest device</h2>
<span id="nd-added" style="font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; color: #4a5650"></span>
</div>
<div id="device-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(21.25rem, 100%), 1fr)); gap: 1rem"></div>
</section>

<section aria-labelledby="fac" style="display: flex; flex-direction: column; gap: 1rem">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem">
<h2 id="fac" style="margin: 0; font-size: 1.25rem; font-weight: 700; margin-right: auto">Faculty</h2>
<label style="flex: 1 1 18rem; max-width: 26rem; display: flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; background: #ffffff">
<input type="search" id="q" aria-label="Search a name" placeholder="Search a name in all schools" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 0.9375rem; background: transparent; color: #1a211e">
<svg viewBox="0 0 24 24" fill="none" stroke="#56625c" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 1rem; height: 1rem; flex: none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
</label>
</div>
<div id="school-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(16.25rem, 100%), 1fr)); gap: 0.75rem"></div>
<div id="results" hidden style="display: flex; flex-direction: column; gap: 0.75rem">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem">
<button type="button" id="back" style="display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2.75rem; margin-left: -0.5rem; padding: 0 0.5rem; border: 0; border-radius: 0.5rem; background: transparent; color: #2a4a7a; font: inherit; font-size: 0.9375rem; font-weight: 600; cursor: pointer">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1rem; height: 1rem"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
All schools</button>
<span id="count-text" style="font-size: 0.875rem; color: #4a5650"></span>
</div>
<div id="people-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(16.25rem, 100%), 1fr)); gap: 0.75rem"></div>
<div id="empty" hidden style="padding: 2rem; text-align: center; background: #ffffff; border: 1px dashed #b8c1cf; border-radius: 0.75rem; color: #4a5650">No one matches. Try a shorter name.</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: stretch">
<section aria-labelledby="ev" style="flex: 1 1 28rem; min-width: 0; background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1.375rem; display: flex; flex-direction: column; gap: 0.875rem">
<h2 id="ev" style="margin: 0; font-size: 1.25rem; font-weight: 700">Recent events</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 40rem; border-collapse: collapse; font-size: 0.875rem">
<thead><tr>
<th style="text-align: left; padding: 0.625rem 0.75rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Time</th>
<th style="text-align: left; padding: 0.625rem 0.75rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Device</th>
<th style="text-align: left; padding: 0.625rem 0.75rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Event</th>
<th style="text-align: left; padding: 0.625rem 0.75rem; border-bottom: 1px solid #dde2ea; color: #4a5650; font-weight: 600; font-size: 0.8125rem">Detail</th>
</tr></thead>
<tbody id="events"></tbody>
</table>
</div>
</section>

<section aria-labelledby="lg" style="flex: 1 1 28rem; min-width: 0; background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.75rem; padding: 1.375rem; display: flex; flex-direction: column; gap: 0.875rem">
<h2 id="lg" style="margin: 0; font-size: 1.25rem; font-weight: 700">Server log <span style="font-weight: 400; font-size: 0.875rem; color: #4a5650">newest at the bottom</span></h2>
<pre id="server-log" style="margin: 0; background: #141e30; color: #d5deec; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-family: 'IBM Plex Mono', monospace; font-size: 0.8125rem; line-height: 1.6; max-height: 17.5rem; white-space: pre-wrap">[server log lines appear here]</pre>
</section>
</div>
</main>
</div>
<script src="api.js"></script>
<script src="devices.js"></script>
</body>
</html>
