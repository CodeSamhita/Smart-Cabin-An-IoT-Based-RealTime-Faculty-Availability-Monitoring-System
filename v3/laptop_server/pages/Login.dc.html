<!doctype html>
<!-- Smart Cabin - login (user's design). One box for the admin and faculty (username, server id or ID card number);
     a faculty member's first login sets their own password. On the very first start it makes the admin account
     instead (only on the laptop that runs the server). Logic in login.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Cabin – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html{font-size:clamp(14px, 0.42vw + 10.6px, 22px)}
body{margin:0}
a{color:#2a4a7a}a:hover{color:#14243f}
[hidden]{display:none !important}
</style>
</head>
<body>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 1rem; color: #1a211e; background: #f4f5f8; min-height: 100vh; display: flex; flex-direction: column">

<header style="background: #1b2d4b; color: #ffffff">
<div style="max-width: 72.5rem; margin: 0 auto; padding: 0.875rem 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.75rem; box-sizing: border-box; width: 100%">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 0.625rem; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 1.125rem; margin-right: auto">
Smart Cabin</a></div>
</header>

<main style="flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 4.5rem 1.5rem">
<div style="width: 100%; max-width: 26.25rem; display: flex; flex-direction: column; gap: 1.25rem">
<a href="Main.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 0.375rem; min-height: 2.75rem; margin-left: -0.5rem; padding: 0 0.5rem; border-radius: 0.5rem; color: #2a4a7a; text-decoration: none; font-size: 0.9375rem; font-weight: 600">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1rem; height: 1rem"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
Go back</a>
<div style="background: #ffffff; border: 1px solid #dde2ea; border-radius: 0.875rem; padding: 2rem; display: flex; flex-direction: column; gap: 1.375rem; box-shadow: 0 0.75rem 2rem rgba(27,45,75,0.08)">
<div style="display: flex; flex-direction: column; gap: 0.625rem">
<h1 id="login-title" style="margin: 0; font-size: 1.625rem; font-weight: 700">Login</h1>
</div>
<form id="login-form" style="display: flex; flex-direction: column; gap: 1rem">
<label style="display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.875rem; font-weight: 600; color: #3c4842">Username
<input type="text" id="username" autocomplete="username" style="min-height: 2.875rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; font: inherit; font-size: 0.9375rem; font-weight: 400; color: #1a211e; background: #ffffff"></label>
<label style="display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.875rem; font-weight: 600; color: #3c4842">Password
<input type="password" id="password" autocomplete="current-password" style="min-height: 2.875rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; font: inherit; font-size: 0.9375rem; font-weight: 400; color: #1a211e; background: #ffffff"></label>
<button type="submit" id="login-btn" style="min-height: 3rem; border: 0; border-radius: 0.5rem; background: #1b2d4b; color: #ffffff; font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.25rem">Log in</button>
</form>
<form id="set-form" hidden style="display: flex; flex-direction: column; gap: 1rem">
<label style="display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.875rem; font-weight: 600; color: #3c4842">New password
<input type="password" id="new-password" autocomplete="new-password" style="min-height: 2.875rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; font: inherit; font-size: 0.9375rem; font-weight: 400; color: #1a211e; background: #ffffff"></label>
<label style="display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.875rem; font-weight: 600; color: #3c4842">New password again
<input type="password" id="new-again" autocomplete="new-password" style="min-height: 2.875rem; padding: 0 0.75rem; border: 1px solid #b8c1cf; border-radius: 0.5rem; font: inherit; font-size: 0.9375rem; font-weight: 400; color: #1a211e; background: #ffffff"></label>
<button type="submit" id="set-btn" style="min-height: 3rem; border: 0; border-radius: 0.5rem; background: #1b2d4b; color: #ffffff; font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.25rem">Save password</button>
</form>
<div id="login-error" hidden role="status" style="display: flex; gap: 0.625rem; align-items: flex-start; padding: 0.75rem 0.875rem; border-radius: 0.5rem; background: #f8dcd5; color: #8a2412; font-size: 0.875rem">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 1.125rem; height: 1.125rem; flex: none; margin-top: 0.0625rem"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
<span id="login-error-text">Wrong username or password.</span>
</div>
</div>
</div>
</main>
</div>
<script src="api.js"></script>
<script src="login.js"></script>
</body>
</html>
