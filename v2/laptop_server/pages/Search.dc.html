<!doctype html>
<!-- Smart Cabin - search page (user's design): name, school, department, programme and status filters, and the picked
     person's details with today's timetable. Filled with live data by search.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Cabin – Find a faculty member</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f6b4f}a:hover{color:#143f30}
[hidden]{display:none !important}
</style>
</head>
<body>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1a211e; background: #f5f6f2; min-height: 100vh">

<header style="background: #1f4f3d; color: #ffffff">
<div style="max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 18px; margin-right: auto">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"></path><path d="M2 21h20"></path><circle cx="15" cy="12" r="1"></circle><circle cx="12" cy="7" r="1.6" fill="#7fd6a1" stroke="none"></circle></svg>
Smart Cabin</a>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #cfe8db">Live · updated <span id="live-time">–</span></span>
<a href="Main.dc.html" style="color: #e3f3ea; text-decoration: none; font-weight: 500; padding: 10px 0">Home</a>
</div>
</header>

<main style="max-width: 1160px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700">Find a faculty member</h1>
<p style="margin: 0; color: #4a5650">Anyone can search. Pick a person to see today's timetable.</p>
</div>

<div style="background: #ffffff; border: 1px solid #dde3df; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<label style="flex: 2 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3c4842">Name
<span style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; border: 1px solid #b7c3bc; border-radius: 8px; background: #ffffff">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56625c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" id="q" placeholder="Search a name, e.g. Pallavi" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; font-weight: 400; background: transparent; color: #1a211e"></span>
</label>
<label style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3c4842">School
<select id="school" style="min-height: 46px; padding: 0 10px; border: 1px solid #b7c3bc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; color: #1a211e"><option value="">All schools</option></select>
</label>
<label style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3c4842">Department
<select id="department" style="min-height: 46px; padding: 0 10px; border: 1px solid #b7c3bc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; color: #1a211e"><option value="">All departments</option></select>
</label>
<label style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3c4842">Programme
<select id="programme" style="min-height: 46px; padding: 0 10px; border: 1px solid #b7c3bc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 400; color: #1a211e"><option value="">All programmes</option></select>
</label>
</div>
<div id="chips" role="group" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p id="count-text" style="margin: 0; font-size: 14px; color: #4a5650">Loading…</p>
<div id="people-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px"></div>
<div id="empty" hidden style="padding: 32px; text-align: center; background: #ffffff; border: 1px dashed #b7c3bc; border-radius: 12px; color: #4a5650">No one matches. Try a shorter name or clear the filters.</div>
</div>

<aside id="selected" hidden aria-label="Selected faculty member" style="flex: 1 1 320px; min-width: 0; background: #ffffff; border: 1px solid #dde3df; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<span id="sel-initials" style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #1f4f3d; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px"></span>
<div style="min-width: 0">
<h2 id="sel-name" style="margin: 0; font-size: 20px; font-weight: 700"></h2>
<p id="sel-designation" style="margin: 2px 0 0; font-size: 14px; color: #56625c"></p>
</div>
</div>
<span id="sel-pill"><span id="sel-dot"></span><span id="sel-status"></span></span>
<p id="sel-how" hidden style="margin: -12px 0 0; font-size: 13px; color: #56625c"></p>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px">
<dt style="color: #56625c">School</dt><dd id="sel-school" style="margin: 0"></dd>
<dt style="color: #56625c">Cabin</dt><dd id="sel-cabin" style="margin: 0"></dd>
<dt style="color: #56625c">Last seen</dt><dd id="sel-seen" style="margin: 0; font-family: 'IBM Plex Mono', monospace">–</dd>
</dl>
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 600">Today's timetable</h3>
<div id="sel-timetable" style="display: flex; flex-direction: column; gap: 10px"></div>
</div>
</aside>
</div>
</main>
</div>
<script src="api.js"></script>
<script src="search.js"></script>
</body>
</html>
